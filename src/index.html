  <script>
    $(document).ready(function () {
      "use strict";
      var offSetTop = 100;
      var $scrollToTopButton = $('.scrollToTop');
      $(window).scroll(function () {
        if ($(this).scrollTop() > offSetTop) {
          $scrollToTopButton.fadeIn();
          document.getElementById('scroll_Top_btn').style.display = 'block'

        } else {
          $scrollToTopButton.fadeOut();
          document.getElementById('scroll_Top_btn').style.display = 'none'
        }
      });
      $scrollToTopButton.click(function () {
        $('html, body').animate({ scrollTop: 0 }, 100);
        return false;
      });

    });
  </script>
  <script>
    $(window).scroll(function () {
      if ($(window).width() < 600) {
        document.getElementById('whiteHeader').style.display = 'none'
        document.getElementById('footer_btn1').style.display = 'none'

      } else {
        if ($(this).scrollTop() < 100) {
          $('.nav').addClass('sticky')
          document.getElementById('header_btn').style.display = 'block'
          document.getElementById('whiteHeader').style.display = 'block'
          document.getElementById('whiteHeader_dark').style.display = 'none'
          document.getElementById('footer_btn').style.display = 'none'
          document.getElementById('footer_btn1').style.display = 'none'
        } else {
          $('.nav').removeClass('sticky')
          document.getElementById('header_btn').style.display = 'none'
          document.getElementById('whiteHeader').style.display = 'none'
          document.getElementById('whiteHeader_dark').style.display = 'block'
          document.getElementById('footer_btn').style.display = 'block'
          document.getElementById('footer_btn1').style.display = 'block'
        }
      }
    });

    $(document).ready(function () {
      var input = document.getElementById("input"),

        submit = document.getElementById("submit"),

        boxCAPTCHA = document.getElementById("box-CAPTCHA"),

        boxDone = document.getElementById("box-done"),

        CAPTCHA = document.getElementById("CAPTCHA");
      if (input != null) {

        input.onfocus = function () {

          "use strict";

          if (this.placeholder === "Type CAPTCHA Here") {

            this.placeholder = "";
          }

        };

        input.onblur = function () {

          "use strict";

          if (this.placeholder === "") {

            this.placeholder = "Type CAPTCHA Here";
          }

        };
      }

    })
  </script>
