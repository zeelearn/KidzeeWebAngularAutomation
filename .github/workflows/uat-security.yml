name: UAT - Code Quality & Security

on:
  push:
    branches:
      - uat
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"

  # SonarQube
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  quality-security:
    name: SonarQube + Semgrep
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout UAT
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ============================================================
      # 2. BASIC ENVIRONMENT
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
        continue-on-error: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ============================================================
      # 3. INSTALL SEMGREP
      # ============================================================
      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

          semgrep --version

      # ============================================================
      # 4. SONARQUBE SCAN
      # ============================================================
      - name: SonarQube Scan
        id: sonar
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.event.repository.name }}
            -Dsonar.projectName=${{ github.event.repository.name }}
            -Dsonar.branch.name=uat
            -Dsonar.scm.provider=git
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      # ============================================================
      # 5. GET SONARQUBE QUALITY GATE
      # ============================================================
      - name: Get SonarQube Quality Gate
        id: sonar_gate
        continue-on-error: true
        shell: bash
        run: |

          echo "Reading SonarQube Quality Gate..."

          RESPONSE=$(curl -s \
            -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${{ github.event.repository.name }}&branch=uat")

          echo "$RESPONSE" > sonar-quality-gate.json

          STATUS=$(echo "$RESPONSE" | jq -r '.projectStatus.status // "ERROR"')

          echo "SonarQube Quality Gate: $STATUS"

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 6. GET SONARQUBE ISSUE COUNTS
      # ============================================================
      - name: Get SonarQube Issue Counts
        id: sonar_issues
        continue-on-error: true
        shell: bash
        run: |

          echo "Collecting SonarQube issue counts..."

          BASE_URL="${SONAR_HOST_URL}/api/issues/search"
          PROJECT="${{ github.event.repository.name }}"

          get_count() {
            SEVERITY="$1"

            curl -s \
              -u "${SONAR_TOKEN}:" \
              "${BASE_URL}?componentKeys=${PROJECT}&branch=uat&severities=${SEVERITY}&resolved=false&ps=1" \
              | jq -r '.total // 0'
          }

          BLOCKER=$(get_count BLOCKER)
          CRITICAL=$(get_count CRITICAL)
          MAJOR=$(get_count MAJOR)
          MINOR=$(get_count MINOR)
          INFO=$(get_count INFO)

          VULNERABILITIES=$(curl -s \
            -u "${SONAR_TOKEN}:" \
            "${BASE_URL}?componentKeys=${PROJECT}&branch=uat&types=VULNERABILITY&resolved=false&ps=1" \
            | jq -r '.total // 0')

          BUGS=$(curl -s \
            -u "${SONAR_TOKEN}:" \
            "${BASE_URL}?componentKeys=${PROJECT}&branch=uat&types=BUG&resolved=false&ps=1" \
            | jq -r '.total // 0')

          CODE_SMELLS=$(curl -s \
            -u "${SONAR_TOKEN}:" \
            "${BASE_URL}?componentKeys=${PROJECT}&branch=uat&types=CODE_SMELL&resolved=false&ps=1" \
            | jq -r '.total // 0')

          HOTSPOTS=$(curl -s \
            -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/hotspots/search?projectKey=${PROJECT}&branch=uat&status=TO_REVIEW&ps=1" \
            | jq -r '.paging.total // 0')

          echo "BLOCKER=$BLOCKER" >> "$GITHUB_OUTPUT"
          echo "CRITICAL=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "MAJOR=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "MINOR=$MINOR" >> "$GITHUB_OUTPUT"
          echo "INFO=$INFO" >> "$GITHUB_OUTPUT"

          echo "VULNERABILITIES=$VULNERABILITIES" >> "$GITHUB_OUTPUT"
          echo "BUGS=$BUGS" >> "$GITHUB_OUTPUT"
          echo "CODE_SMELLS=$CODE_SMELLS" >> "$GITHUB_OUTPUT"
          echo "HOTSPOTS=$HOTSPOTS" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 7. SEMGREP SAST
      # ============================================================
      - name: Run Semgrep SAST
        id: semgrep
        continue-on-error: true
        shell: bash
        run: |

          mkdir -p security-reports

          semgrep scan \
            --config auto \
            --json \
            --output security-reports/semgrep.json \
            --exclude .git \
            --exclude build \
            --exclude node_modules \
            --exclude .dart_tool \
            --exclude ios/Pods \
            --exclude android/.gradle \
            --exclude android/build \
            --exclude web \
            --exclude firebase_options.dart \
            .

      # ============================================================
      # 8. SEMGREP SARIF
      # ============================================================
      - name: Run Semgrep SARIF
        id: semgrep_sarif
        continue-on-error: true
        shell: bash
        run: |

          semgrep scan \
            --config auto \
            --sarif \
            --output security-reports/semgrep.sarif \
            --exclude .git \
            --exclude build \
            --exclude node_modules \
            --exclude .dart_tool \
            --exclude ios/Pods \
            --exclude android/.gradle \
            --exclude android/build \
            --exclude web \
            --exclude firebase_options.dart \
            .

      # ============================================================
      # 9. SEMGREP COUNTS
      # ============================================================
      - name: Calculate Semgrep Findings
        id: semgrep_counts
        if: always()
        shell: bash
        run: |

          FILE="security-reports/semgrep.json"

          if [ ! -f "$FILE" ]; then

            echo "TOTAL=0" >> "$GITHUB_OUTPUT"
            echo "ERROR=0" >> "$GITHUB_OUTPUT"
            echo "WARNING=0" >> "$GITHUB_OUTPUT"
            echo "INFO=0" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          TOTAL=$(jq '.results | length' "$FILE")

          ERROR=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' "$FILE")

          WARNING=$(jq '[.results[] | select(.extra.severity == "WARNING")] | length' "$FILE")

          INFO=$(jq '[.results[] | select(.extra.severity == "INFO")] | length' "$FILE")

          echo "TOTAL=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "ERROR=$ERROR" >> "$GITHUB_OUTPUT"
          echo "WARNING=$WARNING" >> "$GITHUB_OUTPUT"
          echo "INFO=$INFO" >> "$GITHUB_OUTPUT"

          echo "Semgrep Total      : $TOTAL"
          echo "Semgrep ERROR      : $ERROR"
          echo "Semgrep WARNING    : $WARNING"
          echo "Semgrep INFO       : $INFO"

      # ============================================================
      # 10. UPLOAD SARIF TO GITHUB
      # ============================================================
      - name: Upload Semgrep SARIF
        if: always() && hashFiles('security-reports/semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security-reports/semgrep.sarif
        continue-on-error: true

      # ============================================================
      # 11. DETERMINE FINAL STATUS
      # ============================================================
      - name: Determine Security Gate
        id: gate
        if: always()
        shell: bash
        run: |

          SONAR_STATUS="${{ steps.sonar_gate.outputs.status }}"
          SEMGREP_ERROR="${{ steps.semgrep_counts.outputs.ERROR }}"

          echo "SonarQube Status : $SONAR_STATUS"
          echo "Semgrep ERROR    : $SEMGREP_ERROR"

          FINAL_STATUS="PASS"

          if [ "$SONAR_STATUS" != "OK" ]; then
            FINAL_STATUS="FAIL"
          fi

          if [ "${SEMGREP_ERROR:-0}" -gt 0 ]; then
            FINAL_STATUS="FAIL"
          fi

          echo "FINAL_STATUS=$FINAL_STATUS" >> "$GITHUB_OUTPUT"

          if [ "$FINAL_STATUS" = "PASS" ]; then
            echo "Security and quality gate PASSED."
          else
            echo "Security and quality gate FAILED."
          fi

      # ============================================================
      # 12. CREATE HTML EMAIL REPORT
      # ============================================================
      - name: Create Email Report
        if: always()
        shell: bash
        run: |

          SONAR_STATUS="${{ steps.sonar_gate.outputs.status }}"
          FINAL_STATUS="${{ steps.gate.outputs.FINAL_STATUS }}"

          if [ "$FINAL_STATUS" = "PASS" ]; then
            STATUS_TEXT="PASSED"
          else
            STATUS_TEXT="FAILED"
          fi

          cat > security-report.html <<EOF
          <html>
          <body style="font-family:Arial,Helvetica,sans-serif;">

          <h2>Git Code Quality & Security Report</h2>

          <table border="1" cellpadding="8" cellspacing="0"
                 style="border-collapse:collapse;width:100%;">

          <tr>
            <td><b>Repository</b></td>
            <td>${{ github.repository }}</td>
          </tr>

          <tr>
            <td><b>Branch</b></td>
            <td>uat</td>
          </tr>

          <tr>
            <td><b>Commit</b></td>
            <td>${{ github.sha }}</td>
          </tr>

          <tr>
            <td><b>Developer</b></td>
            <td>${{ github.actor }}</td>
          </tr>

          <tr>
            <td><b>Overall Status</b></td>
            <td><b>${STATUS_TEXT}</b></td>
          </tr>

          </table>

          <br>

          <h3>SonarQube</h3>

          <table border="1" cellpadding="8" cellspacing="0"
                 style="border-collapse:collapse;width:100%;">

          <tr>
            <th>Metric</th>
            <th>Count</th>
          </tr>

          <tr>
            <td>Quality Gate</td>
            <td>${SONAR_STATUS}</td>
          </tr>

          <tr>
            <td>Blocker</td>
            <td>${{ steps.sonar_issues.outputs.BLOCKER }}</td>
          </tr>

          <tr>
            <td>Critical</td>
            <td>${{ steps.sonar_issues.outputs.CRITICAL }}</td>
          </tr>

          <tr>
            <td>Major</td>
            <td>${{ steps.sonar_issues.outputs.MAJOR }}</td>
          </tr>

          <tr>
            <td>Minor</td>
            <td>${{ steps.sonar_issues.outputs.MINOR }}</td>
          </tr>

          <tr>
            <td>Bugs</td>
            <td>${{ steps.sonar_issues.outputs.BUGS }}</td>
          </tr>

          <tr>
            <td>Vulnerabilities</td>
            <td>${{ steps.sonar_issues.outputs.VULNERABILITIES }}</td>
          </tr>

          <tr>
            <td>Security Hotspots</td>
            <td>${{ steps.sonar_issues.outputs.HOTSPOTS }}</td>
          </tr>

          <tr>
            <td>Code Smells</td>
            <td>${{ steps.sonar_issues.outputs.CODE_SMELLS }}</td>
          </tr>

          </table>

          <br>

          <h3>Semgrep SAST</h3>

          <table border="1" cellpadding="8" cellspacing="0"
                 style="border-collapse:collapse;width:100%;">

          <tr>
            <th>Severity</th>
            <th>Count</th>
          </tr>

          <tr>
            <td>Total Findings</td>
            <td>${{ steps.semgrep_counts.outputs.TOTAL }}</td>
          </tr>

          <tr>
            <td>ERROR</td>
            <td>${{ steps.semgrep_counts.outputs.ERROR }}</td>
          </tr>

          <tr>
            <td>WARNING</td>
            <td>${{ steps.semgrep_counts.outputs.WARNING }}</td>
          </tr>

          <tr>
            <td>INFO</td>
            <td>${{ steps.semgrep_counts.outputs.INFO }}</td>
          </tr>

          </table>

          <br>

          <h3>Required Action</h3>

          <p>
          Review and resolve all Critical/High security findings and
          SonarQube Quality Gate failures before promoting the code
          from <b>UAT</b> to <b>main</b>.
          </p>

          <p>
          <b>GitHub Actions Run:</b>
          <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
          View Workflow Run
          </a>
          </p>

          <p>
          <b>SonarQube:</b>
          <a href="${SONAR_HOST_URL}/dashboard?id=${{ github.event.repository.name }}&branch=uat">
          Open SonarQube Project
          </a>
          </p>

          </body>
          </html>
          EOF

          echo "Email report generated."

      # ============================================================
      # 13. SEND EMAIL
      # ============================================================
      - name: Send Code Quality & Security Email
        if: always()
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: ${{ secrets.SMTP_SECURE }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          from: ${{ secrets.SMTP_FROM }}
          to: ${{ secrets.SECURITY_EMAIL_TO }}
          cc: ${{ secrets.SECURITY_EMAIL_CC }}

          subject: >
            [${{ steps.gate.outputs.FINAL_STATUS }}]
            UAT Code Quality & Security -
            ${{ github.event.repository.name }}

          html_body: file://security-report.html

          attachments: |
            security-reports/semgrep.json,
            security-reports/semgrep.sarif

      # ============================================================
      # 14. FAIL WORKFLOW IF GATE FAILED
      # ============================================================
      - name: Enforce Security Gate
        if: always()
        shell: bash
        run: |

          if [ "${{ steps.gate.outputs.FINAL_STATUS }}" != "PASS" ]; then

            echo "======================================"
            echo " CODE QUALITY / SECURITY GATE FAILED "
            echo "======================================"

            exit 1
          fi

          echo "======================================"
          echo " CODE QUALITY / SECURITY GATE PASSED "
          echo "======================================"
