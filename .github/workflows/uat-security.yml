name: UAT - Code Quality & Security

on:
  push:
    branches:
      - uat
  workflow_dispatch:

# Prevent multiple scans for the same branch from running simultaneously.
concurrency:
  group: uat-security-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: "24"
  FLUTTER_VERSION: "stable"
  PYTHON_VERSION: "3.12"

jobs:

  # ============================================================
  # 1. DETECT PROJECT TYPE
  # ============================================================
  detect:
    name: Detect Project
    runs-on: ubuntu-latest

    outputs:
      flutter: ${{ steps.detect.outputs.flutter }}
      node: ${{ steps.detect.outputs.node }}
      angular: ${{ steps.detect.outputs.angular }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Detect technologies
        id: detect
        shell: bash
        run: |
          flutter=false
          node=false
          angular=false

          if [ -f "pubspec.yaml" ]; then
            flutter=true
          fi

          if [ -f "package.json" ]; then
            node=true
          fi

          if [ -f "angular.json" ]; then
            angular=true
          fi

          echo "flutter=$flutter" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "angular=$angular" >> "$GITHUB_OUTPUT"

          echo "Flutter: $flutter"
          echo "Node.js: $node"
          echo "Angular: $angular"

  # ============================================================
  # 2. SECRET SCANNING
  # ============================================================
  secret-scan:
    name: 🔐 Secret Scan - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 3. SONARQUBE CODE QUALITY & SECURITY
  # ============================================================
  sonarqube:
    name: 📊 SonarQube Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history improves SonarQube blame/new-code analysis.
          fetch-depth: 0

      - name: Validate SonarQube configuration
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          set -e

          if [ -z "$SONAR_TOKEN" ]; then
            echo "❌ Missing GitHub secret: SONAR_TOKEN"
            exit 1
          fi

          if [ -z "$SONAR_HOST_URL" ]; then
            echo "❌ Missing GitHub secret: SONAR_HOST_URL"
            exit 1
          fi

          if [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "❌ Missing GitHub secret: SONAR_PROJECT_KEY"
            exit 1
          fi

          echo "✅ SonarQube configuration found."

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.projectName=eKidzeeAppAutomation
            -Dsonar.sources=.
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.exclusions=**/.git/**,**/build/**,**/node_modules/**,**/.dart_tool/**,**/ios/Pods/**,**/android/.gradle/**,**/android/app/.cxx/**,**/.github/**,**/firebase_options.dart,**/web/sqflite_sw.js,**/ios/Runner/Info.plist,**/ios/Runner/Infomlzs.plist,**/ios/install.sh,**/ios/Runner/Vuforia/**,**/Vuforia/**,**/VuforiaEngine.framework/**,**/*.framework/**,**/*.xcframework/**,**/*.a,**/*.dylib,**/*.so,**/*.aar,**/*.ipa,**/*.apk,**/*.aab,**/*.bin

  # ============================================================
  # 4. SAST - SEMGREP
  # ============================================================
  # IMPORTANT:
  # Semgrep starts only after SonarQube has completed successfully.
  sast:
    name: 🛡️ SAST - Semgrep
    needs:
      - sonarqube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep

      - name: Run Semgrep
        shell: bash
        run: |
          semgrep scan \
            --config auto \
            --error \
            --exclude .git \
            --exclude build \
            --exclude node_modules \
            --exclude .dart_tool \
            --exclude ios/Pods \
            --exclude android/.gradle \
            --exclude android/app/.cxx \
            --exclude .github \
            --exclude '**/firebase_options.dart' \
            --exclude 'lib/pages/notification/firebase_options.dart' \
            --exclude 'web/sqflite_sw.js' \
            --exclude 'ios/Runner/Info.plist' \
            --exclude 'ios/Runner/Infomlzs.plist'

  # ============================================================
  # 5. TRIVY DEPENDENCY / FILESYSTEM SCAN
  # ============================================================
  dependency-scan:
    name: 📦 Dependency Scan - Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # ============================================================
  # 6. FLUTTER / DART
  # ============================================================
  flutter:
    name: 📱 Flutter Quality
    needs: detect
    if: needs.detect.outputs.flutter == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter version
        run: flutter --version

      
      - name: Get dependencies
        run: flutter pub get

      - name: Check outdated dependencies
        continue-on-error: true
        run: flutter pub outdated

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  # ============================================================
  # 7. NODE / ANGULAR
  # ============================================================
  node:
    name: 🟢 Node.js / Angular Quality
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # No package-lock.json exists in this repository,
      # so setup-node npm dependency caching is disabled.
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # --------------------------------------------------------
      # ESLint
      # --------------------------------------------------------
      - name: ESLint
        shell: bash
        run: |
          set -e

          echo "Checking ESLint configuration..."

          # Angular projects require a configured lint target
          # before "ng lint" can be executed.
          #
          # Having this in package.json:
          #
          #   "lint": "ng lint"
          #
          # does NOT mean Angular has a lint target.
          #
          # Therefore, check angular.json first.

          if [ -f angular.json ] && \
             node -e "
               const fs = require('fs');

               const a = JSON.parse(
                 fs.readFileSync('angular.json', 'utf8')
               );

               const projects = a.projects || {};

               const hasLint = Object.values(projects).some(
                 p => p.architect?.lint || p.targets?.lint
               );

               process.exit(hasLint ? 0 : 1);
             "; then

            echo "Angular lint target found."
            echo "Running Angular lint..."

            npx ng lint

          elif [ -f "eslint.config.js" ] || \
               [ -f "eslint.config.mjs" ] || \
               [ -f "eslint.config.cjs" ] || \
               [ -f ".eslintrc.json" ] || \
               [ -f ".eslintrc.js" ] || \
               [ -f ".eslintrc.cjs" ]; then

            echo "Standalone ESLint configuration found."
            echo "Running ESLint..."

            npx eslint . --max-warnings=0

          else

            echo "No ESLint configuration or Angular lint target found."
            echo "Skipping ESLint."

          fi

      # --------------------------------------------------------
      # TypeScript
      # --------------------------------------------------------
      - name: TypeScript validation
        shell: bash
        run: |
          set -e

          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "No tsconfig.json found. Skipping."
          fi

      # --------------------------------------------------------
      # Unit Tests
      # --------------------------------------------------------
      - name: Run tests
        shell: bash
        run: |
          set -e

          if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)" 2>/dev/null; then
            npm test -- --watch=false
          else
            echo "No test script found. Skipping."
          fi

      # --------------------------------------------------------
      # NPM SECURITY
      # --------------------------------------------------------
      - name: NPM audit
        shell: bash
        run: |
          set -e

          npm audit \
            --audit-level=high \
            --omit=dev

  # ============================================================
  # 8. ANGULAR BUILD
  # ============================================================
  angular-build:
    name: 🅰️ Angular Build
    needs:
      - detect
      - node

    if: |
      needs.detect.outputs.angular == 'true' &&
      needs.node.result == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # No package-lock.json exists in this repository,
      # so npm install is used.
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Angular CLI
        shell: bash
        run: |
          if [ -x "./node_modules/.bin/ng" ]; then
            echo "Using project-local Angular CLI."
          else
            npm install -g @angular/cli
          fi

      - name: Angular Build
        shell: bash
        run: |
          set -e

          if [ -x "./node_modules/.bin/ng" ]; then
            ./node_modules/.bin/ng build
          else
            ng build
          fi

  # ============================================================
  # 9. LICENSE / DEPENDENCY POLICY
  # ============================================================
  dependency-policy:
    name: 📜 Dependency Policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check package files
        shell: bash
        run: |
          set -e

          echo "Checking dependency manifests..."

          if [ -f package.json ]; then
            echo "Node.js package detected"
          fi

          if [ -f pubspec.yaml ]; then
            echo "Flutter package detected"
          fi

          if [ -f package-lock.json ]; then
            echo "package-lock.json detected"
          fi

          echo "Dependency policy check completed."

  # ============================================================
  # 10. UAT SECURITY SUMMARY
  # ============================================================
  uat-summary:
    name: 🚦 UAT Security Gate

    needs:
      - detect
      - secret-scan
      - sast
      - sonarqube
      - dependency-scan
      - flutter
      - node
      - angular-build
      - dependency-policy

    if: always()

    runs-on: ubuntu-latest

    steps:
      - name: Evaluate security results
        shell: bash
        run: |
          echo "=========================================="
          echo "       UAT SECURITY SUMMARY"
          echo "=========================================="

          echo "Secret Scan       : ${{ needs.secret-scan.result }}"
          echo "Semgrep SAST      : ${{ needs.sast.result }}"
          echo "SonarQube         : ${{ needs.sonarqube.result }}"
          echo "Dependency Scan   : ${{ needs.dependency-scan.result }}"
          echo "Flutter           : ${{ needs.flutter.result }}"
          echo "Node.js           : ${{ needs.node.result }}"
          echo "Angular Build     : ${{ needs.angular-build.result }}"
          echo "Dependency Policy : ${{ needs.dependency-policy.result }}"

          echo "=========================================="

          FAILED=false

          if [[ "${{ needs.secret-scan.result }}" == "failure" ]]; then
            FAILED=true
          fi

          if [[ "${{ needs.sast.result }}" == "failure" ]]; then
            FAILED=true
          fi

          if [[ "${{ needs.sonarqube.result }}" == "failure" ]]; then
            FAILED=true
          fi

          if [[ "${{ needs.dependency-scan.result }}" == "failure" ]]; then
            FAILED=true
          fi

          if [[ "${{ needs.flutter.result }}" == "failure" ]]; then
            FAILED=true
          fi

          if [[ "${{ needs.node.result }}" == "failure" ]]; then
            FAILED=true
          fi

          if [[ "${{ needs.angular-build.result }}" == "failure" ]]; then
            FAILED=true
          fi

          if [[ "${{ needs.dependency-policy.result }}" == "failure" ]]; then
            FAILED=true
          fi

          if [[ "$FAILED" == "true" ]]; then
            echo ""
            echo "❌ UAT SECURITY GATE FAILED"
            echo ""
            echo "Please fix the reported issues before promoting code."
            exit 1
          fi

          echo ""
          echo "✅ UAT SECURITY GATE PASSED"
          echo ""
